server {
  listen 80;
  root /usr/share/nginx/html;

  # docker DNS, re-resolved so a recreated backend container (new IP) doesn't cause 502s
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;   # keeps the port, for redirect URLs (SSO callback)
    # chat and /api/events are SSE streams: no buffering, long-lived
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # the user's SaaS connections: straight to the apps broker, so API keys typed there never pass the backend
  set $broker http://apps-broker:8120;
  location /connections/api/ {
    proxy_pass $broker;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
