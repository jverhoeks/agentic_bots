# Tool plane: agentgateway (MCP gateway / tools registry) + internal connectors.
# Dev:        `make up` (tool plane only) + `make dev` (app and UI on the host, reach the gateway on :3000)
# All-in-one: `make up-all` (adds the `app` profile: backend + UI at http://localhost:8080)
services:
  connectors:
    build: ./connectors
    env_file:
      # connectors only: WEB_SEARCH_PROVIDER and its key/URL (see secrets/connectors.env.example)
      - path: secrets/connectors.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    command: ["-f", "/config/config.yaml"]
    environment:
      ADMIN_ADDR: 0.0.0.0:15000   # gateway UI at http://localhost:15000/ui (local dev only)
      A2A_BACKEND: ${A2A_BACKEND:-backend:8000}   # `make up` (app on the host) sets host.docker.internal:8000
    env_file:
      - secrets/trace-ingest.env   # TRACE_INGEST_TOKEN: sent with its spans to the backend (`make jwt-init`)
    volumes:
      - ./gateway:/config:ro
      - ./secrets/jwks.json:/secrets/jwks.json:ro   # public key only (`make jwt-init`)
    ports:
      - "127.0.0.1:3000:3000"   # loopback for now: JWT-protected, but no TLS
      - "127.0.0.1:15000:15000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      connectors:
        condition: service_healthy
      apps-broker:
        condition: service_healthy
    restart: unless-stopped

  # The `apps` MCP target and the Connections page API: the only holder of the open-connector admin
  # token and of each user's runtime token (connectors/src/connectors/apps_broker.py).
  apps-broker:
    build: ./connectors
    command: ["/app/.venv/bin/apps-broker"]
    env_file:
      # OOMOL_CONNECT_ADMIN_TOKEN (`make connector-init`); optional APPS_ALLOWED_ACTIONS / APPS_BLOCKED_ACTIONS
      - secrets/apps-broker.env
    environment:
      OPEN_CONNECTOR_URL: http://open-connector:3000
    volumes:
      - ./secrets/jwks.json:/secrets/jwks.json:ro   # public key only: verifies the users' tokens
      - apps-broker-data:/data                      # per-user runtime tokens
    ports:
      - "127.0.0.1:8120:8120"   # Connections API for `make dev` (the Angular proxy); /mcp needs a token too
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8120/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      open-connector:
        condition: service_started
    restart: unless-stopped

  # SaaS connectors (Gmail, GitHub, Slack, ... 1k+ providers) behind one MCP endpoint:
  # oomol-lab/open-connector (Apache-2.0). Console: http://localhost:3010 (admin token in
  # secrets/open-connector.env). OAuth tokens stay in this container, encrypted at rest.
  open-connector:
    image: ghcr.io/oomol-lab/open-connector:latest
    env_file:
      - secrets/open-connector.env   # generated by `make connector-init`
    environment:
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-http://localhost:3010}   # OAuth redirect: <origin>/oauth/callback
    volumes:
      - connector-data:/app/data
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped

  # Optional PostgreSQL instead of SQLite (`docker compose --profile postgres up -d postgres`), then in .env:
  # DATABASE_URL=postgresql+psycopg://bots:<password>@postgres:5432/bots   (backend in compose)
  # DATABASE_URL=postgresql+psycopg://bots:<password>@localhost:5432/bots  (backend on the host, `make dev`)
  # <password>: POSTGRES_PASSWORD in secrets/postgres.env, generated once by `make secrets-init`.
  postgres:
    profiles: [postgres]
    image: postgres:18-alpine
    env_file:
      - path: secrets/postgres.env   # POSTGRES_PASSWORD (`make secrets-init`)
        required: false
    environment:
      POSTGRES_USER: bots
      POSTGRES_DB: bots
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
      - secrets/trace-ingest.env   # TRACE_INGEST_TOKEN: accepts the gateway's spans
    environment:
      AGENT_GATEWAY_URL: http://agentgateway:3000/mcp   # overrides .env: in-network address
    volumes:
      - ./bots:/app/bots     # SKILL.md files stay on the host (git-friendly)
      - ./data:/app/data     # SQLite runtime state
      - ./secrets/jwt-private.pem:/app/secrets/jwt-private.pem:ro   # signs gateway tokens
    extra_hosts:
      - "host.docker.internal:host-gateway"   # if LiteLLM runs on the host, use http://host.docker.internal:<port>
    depends_on:
      - agentgateway
    restart: unless-stopped

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"   # loopback for now: no TLS (put a TLS proxy in front before opening it up)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  connector-data:
  apps-broker-data:
  postgres-data:
